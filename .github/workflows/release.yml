name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.1.1
        required: true

permissions:
  contents: read

concurrency: release

jobs:
  release:
    runs-on: ubuntu-slim
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - name: Set the version
        run: node version-bump.mjs "$VERSION"

      # Builds main.js for production, then type checks, lints, and checks iOS compatibility
      - name: Check
        run: bun run check

      - name: Test
        run: |
          bun run test:unit
          bun run test:integration

      # Obsidian and BRAT install from the release whose tag equals the manifest version, so no "v" prefix
      - name: Commit, tag, and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || git commit -am "chore: Release ${VERSION}"
          git tag "$VERSION"
          git push origin HEAD "$VERSION"
          gh release create "$VERSION" --title "$VERSION" --generate-notes main.js manifest.json styles.css
